<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 1</title>
    <!-- Open Graph Meta Tags for social sharing (Facebook, etc.) -->
    <meta property="og:title" content="Quiz | k-gou prod" />
    <meta property="og:description" content="Un quiz sur le caillou"/>
    <meta property="og:url" content="https://www.k-gou.com/html/quiz/quizz_cal.html"/>
    <meta property="og:image" content="https://www.k-gou.com/img/quizz1.png"/>
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />

    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for a modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #0d0211; }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #bf00ff, #7a00cc); border-radius: 5px; border: 2px solid #0d0211; }
::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #d400ff, #bf00ff); }
        html {
            scroll-behavior: smooth;
        }
        /* Custom styles for the dark theme and overall feel */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* gray-900 */
            color: #d1d5db; /* gray-300 */
        }

        /* Custom scrollbar for a more integrated look */
        
        
        
        
    </style>
</head>
<body class="antialiased">

    <div class="container mx-auto px-4 py-8 max-w-4xl">

        <!-- Header Section -->
        <header class="flex justify-between items-center mb-10 pb-4 border-b border-gray-700">
            <h1 class="text-3xl md:text-4xl font-black tracking-tighter">
                <span class="bg-gradient-to-r from-fuchsia-600 via-purple-500 to-pink-500 text-transparent bg-clip-text">
                    k-gou prod
                </span>
            </h1>
            <a href="../news.html#quizz1" rel="noopener noreferrer" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50 transition-colors duration-300">
                Retour
            </a>
        </header>

        <!-- Results Section (hidden by default) -->
        <div id="results-container" class="hidden text-center bg-gray-800 p-8 rounded-2xl shadow-2xl mb-8">
            <h2 class="text-3xl font-bold mb-4">Votre résultat</h2>
            <p class="text-5xl font-black mb-6" id="score-display"></p>
            <p class="text-xl text-gray-300" id="score-message"></p>
            <div class="mt-8 flex flex-col sm:flex-row justify-center items-center gap-4">
                <button type="button" id="restart-btn" class="w-full sm:w-auto bg-indigo-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-indigo-500 transition-colors duration-300">
                    Recommencer le quiz
                </button>
                <a href="#quiz-form" class="w-full sm:w-auto bg-gray-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-gray-500 transition-colors duration-300">
                    Voir les réponses
                </a>
            </div>
        </div>

        <main id="quiz-container">
            <h2 class="text-2xl font-bold text-center mb-2">Quiz Calédonien 1</h2>
            <p class="text-center text-gray-400 mb-8">Testez vos connaissances sur "le Caillou" !</p>
            
            <form id="quiz-form" class="space-y-8">
                <!-- Questions will be dynamically inserted here by JavaScript -->
            </form>

            <!-- Validation Button -->
            <div class="mt-12 text-center">
                <button type="button" id="submit-btn" class="bg-green-600 text-white text-xl font-bold py-3 px-8 rounded-lg hover:bg-green-500 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50 transition-all duration-300 transform hover:scale-105">
                    Valider mes réponses
                </button>
            </div>
        </main>

    </div>

    <!-- Scroll to Top Button -->
    <button id="scroll-to-top-btn" title="Remonter en haut" class="hidden fixed bottom-6 right-6 bg-indigo-600 text-white w-12 h-12 rounded-full shadow-lg hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50 transition-all duration-300 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
        </svg>
    </button>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const quizData = [
                {
                    question: "Quelle est la capitale de la Nouvelle-Calédonie ?",
                    name: "q1",
                    answers: [
                        { text: "Hienghène", points: -2 },
                        { text: "Nouméa", points: 2 },
                        { text: "Koné", points: -1 },
                        { text: "Lifou", points: -1 }
                    ]
                },
                {
                    question: "Quel est l'animal emblématique de la Nouvelle-Calédonie ?",
                    name: "q2",
                    answers: [
                        { text: "Le Cagou", points: 2 },
                        { text: "Le Kangourou", points: -2 },
                        { text: "Le Notou", points: 1 },
                        { text: "La Roussette", points: 1 }
                    ]
                },
                {
                    question: "Quelle est la principale ressource minière exportée ?",
                    name: "q3",
                    answers: [
                        { text: "L'or", points: -1 },
                        { text: "Le charbon", points: -2 },
                        { text: "Le Nickel", points: 2 },
                        { text: "Le cuivre", points: -1 }
                    ]
                },
                {
                    question: "Comment s'appelle le plat traditionnel kanak cuit dans des feuilles de bananier ?",
                    name: "q4",
                    answers: [
                        { text: "Le Bougna", points: 2 },
                        { text: "Le Tahitien", points: -2 },
                        { text: "La Salade de cerf", points: -1 },
                        { text: "Le Vol-au-vent", points: -2 }
                    ]
                },
                 {
                    question: "Le lagon calédonien est inscrit au patrimoine mondial de...",
                    name: "q5",
                    answers: [
                        { text: "Greenpeace", points: -2 },
                        { text: "L'UNESCO", points: 2 },
                        { text: "L'Union Européenne", points: -1 },
                        { text: "WWF", points: 0 }
                    ]
                },
                {
                    question: "Quel est le nom de la monnaie utilisée en Nouvelle-Calédonie ?",
                    name: "q6",
                    answers: [
                        { text: "L'Euro", points: -1 },
                        { text: "Le Dollar Australien", points: -2 },
                        { text: "Le Franc Pacifique (CFP)", points: 2 },
                        { text: "Le Franc Français", points: -2 }
                    ]
                },
                {
                    question: "La formation rocheuse célèbre à Hienghène est surnommée...",
                    name: "q7",
                    answers: [
                        { text: "Le Bonhomme", points: 0 },
                        { text: "Le Sphinx", points: 0 },
                        { text: "La Poule Couveuse", points: 2 },
                        { text: "Le Chien de Garde", points: -2 }
                    ]
                },
                {
                    question: "Qu'était le 'Bagne' de Nouvelle-Calédonie ?",
                    name: "q8",
                    answers: [
                        { text: "Une base militaire", points: -1 },
                        { text: "Une colonie pénitentiaire", points: 2 },
                        { text: "Le premier hôpital", points: -1 },
                        { text: "Une plantation de café", points: -2 }
                    ]
                },
                {
                    question: "Quelle est cette fameuse mangrove en forme de cœur visible du ciel ?",
                    name: "q9",
                    answers: [
                        { text: "Le Cœur de Hienghène", points: -2 },
                        { text: "Le Cœur de Voh", points: 2 },
                        { text: "Le Cœur de Poindimié", points: -1 },
                        { text: "Le Cœur de l'Océan", points: -2 }
                    ]
                },
                {
                    question: "Comment nomme-t-on les habitants des zones rurales, en dehors de Nouméa ?",
                    name: "q10",
                    answers: [
                        { text: "Les Campagnards", points: -1 },
                        { text: "Les Bûcherons", points: -2 },
                        { text: "Les Broussards", points: 2 },
                        { text: "Les Zoreilles", points: -2 }
                    ]
                },
                {
                    question: "Le 'Tricot rayé' est un...",
                    name: "q11",
                    answers: [
                        { text: "Pull traditionnel", points: -2 },
                        { text: "Poisson venimeux", points: 0 },
                        { text: "Serpent marin", points: 2 },
                        { text: "Insecte coloré", points: -1 }
                    ]
                },
                {
                    question: "Lequel de ces lieux n'est PAS l'une des Îles Loyauté ?",
                    name: "q12",
                    answers: [
                        { text: "Maré", points: -1 },
                        { text: "Lifou", points: -1 },
                        { text: "Ouvéa", points: -1 },
                        { text: "L'Île des Pins", points: 2 }
                    ]
                },
                {
                    question: "Le Centre Culturel Tjibaou a été conçu par l'architecte...",
                    name: "q13",
                    answers: [
                        { text: "Jean Nouvel", points: -1 },
                        { text: "Renzo Piano", points: 2 },
                        { text: "Le Corbusier", points: -2 },
                        { text: "Gustave Eiffel", points: -2 }
                    ]
                },
                {
                    question: "Quel navigateur européen a 'découvert' la Nouvelle-Calédonie en 1774 ?",
                    name: "q14",
                    answers: [
                        { text: "Christophe Colomb", points: -2 },
                        { text: "James Cook", points: 2 },
                        { text: "Vasco de Gama", points: -2 },
                        { text: "Bougainville", points: -1 }
                    ]
                },
                {
                    question: "Quel événement politique majeur a eu lieu en 1988 pour ramener la paix ?",
                    name: "q15",
                    answers: [
                        { text: "L'Accord de Nouméa", points: 0 },
                        { text: "Le Traité de Versailles", points: -2 },
                        { text: "Les Accords de Matignon", points: 2 },
                        { text: "La Poignée de main de Poindimié", points: -1 }
                    ]
                },
                {
                    question: "Le pin colonnaire est un arbre...",
                    name: "q16",
                    answers: [
                        { text: "Importé d'Australie", points: -2 },
                        { text: "Endémique à la Nouvelle-Calédonie", points: 2 },
                        { text: "Qui pousse uniquement en altitude", points: -1 },
                        { text: "Qui a été planté par les colons", points: -1 }
                    ]
                },
                {
                    question: "L'aéroport international de Nouvelle-Calédonie se nomme :",
                    name: "q17",
                    answers: [
                        { text: "Aéroport de Magenta", points: -1 },
                        { text: "Aéroport de La Tontouta", points: 2 },
                        { text: "Aéroport de Koné", points: -1 },
                        { text: "Aéroport Charles de Gaulle", points: -2 }
                    ]
                },
                {
                    question: "Quelle est la barrière qui entoure la Grande Terre ?",
                    name: "q18",
                    answers: [
                        { text: "La grande barrière de corail", points: 0 },
                        { text: "La barrière de corail", points: 2 },
                        { text: "La chaîne centrale", points: -1 },
                        { text: "La barrière de feu", points: -2 }
                    ]
                },
                {
                    question: "Quelle est la particularité des terres du Grand Sud ?",
                    name: "q19",
                    answers: [
                        { text: "Elles sont très fertiles", points: -2 },
                        { text: "Elles sont volcaniques et noires", points: -1 },
                        { text: "Elles sont rouges en raison du nickel", points: 2 },
                        { text: "Elles sont entièrement recouvertes de forêt", points: -1 }
                    ]
                },
                {
                    question: "Un 'tazar' en Nouvelle-Calédonie est un type de...",
                    name: "q20",
                    answers: [
                        { text: "Requin", points: -1 },
                        { text: "Gecko", points: -2 },
                        { text: "Poisson", points: 2 },
                        { text: "Crabe", points: -1 }
                    ]
                }
            ];

            const quizForm = document.getElementById('quiz-form');
            const submitBtn = document.getElementById('submit-btn');
            const quizContainer = document.getElementById('quiz-container');
            const resultsContainer = document.getElementById('results-container');
            const scoreDisplay = document.getElementById('score-display');
            const scoreMessage = document.getElementById('score-message');
            const restartBtn = document.getElementById('restart-btn');
            const scrollToTopBtn = document.getElementById('scroll-to-top-btn');

            // Function to load and display the quiz questions
            function loadQuiz() {
                quizForm.innerHTML = ''; // Clear previous questions
                quizData.forEach((q, index) => {
                    const questionElement = document.createElement('div');
                    questionElement.className = 'bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700';

                    const questionText = document.createElement('p');
                    questionText.className = 'text-xl font-bold mb-5';
                    // Utiliser textContent est plus sûr pour éviter les injections XSS
                    questionText.textContent = `${index + 1}. ${q.question}`;

                    const answersContainer = document.createElement('div');
                    answersContainer.className = 'space-y-3';

                    q.answers.forEach(answer => {
                        const label = document.createElement('label');
                        label.className = 'block bg-gray-700 p-4 rounded-lg cursor-pointer hover:bg-gray-600 has-[:checked]:bg-indigo-600 has-[:checked]:ring-2 has-[:checked]:ring-indigo-400 transition-all duration-200';

                        const radio = document.createElement('input');
                        radio.type = 'radio';
                        radio.name = q.name;
                        radio.value = answer.points;
                        radio.className = 'hidden';

                        const span = document.createElement('span');
                        span.className = 'text-lg';
                        span.textContent = answer.text; // Utiliser textContent est plus sûr

                        label.appendChild(radio);
                        label.appendChild(span);
                        answersContainer.appendChild(label);
                    });

                    questionElement.appendChild(questionText);
                    questionElement.appendChild(answersContainer);
                    quizForm.appendChild(questionElement);
                });
                 // Re-enable submit button
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
            
            // Function to calculate and display results
            function showResults() {
                const selectedAnswers = quizForm.querySelectorAll('input[type="radio"]:checked');
                
                if (selectedAnswers.length < quizData.length) {
                    alert("Veuillez répondre à toutes les questions avant de valider !");
                    return;
                }

                let score = 0;
                let userPositiveScore = 0;
                selectedAnswers.forEach(input => {
                    const points = parseInt(input.value, 10);
                    score += points;
                    if (points > 0) {
                        userPositiveScore += points;
                    }
                });

                const maxPositiveScore = quizData.reduce((total, question) => {
                    const maxPoints = Math.max(0, ...question.answers.map(a => a.points));
                    return total + maxPoints;
                }, 0);

                scoreDisplay.textContent = `${userPositiveScore} / ${maxPositiveScore} points`;

                let message = '';
                if (score >= 35) {
                    message = "Score parfait ! Vous êtes un véritable expert du Caillou !";
                    scoreDisplay.className = 'text-5xl font-black mb-6 text-green-400';
                } else if (score >= 25) {
                    message = "Excellent score ! Très bonne connaissance de la Nouvelle-Calédonie.";
                    scoreDisplay.className = 'text-5xl font-black mb-6 text-purple-500';
                } else if (score >= 15) {
                    message = "Pas mal du tout ! Vous avez de bonnes bases.";
                    scoreDisplay.className = 'text-5xl font-black mb-6 text-yellow-400';
                } else if (score >= 0) {
                    message = "C'est un début. Une petite révision s'impose peut-être !";
                    scoreDisplay.className = 'text-5xl font-black mb-6 text-orange-400';
                } else {
                    message = "Oups... Le voyage a été difficile ! N'hésitez pas à retenter votre chance.";
                    scoreDisplay.className = 'text-5xl font-black mb-6 text-red-500';
                }
                scoreMessage.textContent = message;

                // Cacher le bouton de validation, afficher les résultats et les corrections
                submitBtn.parentElement.classList.add('hidden');
                resultsContainer.classList.remove('hidden');

                quizData.forEach((q, index) => {
                    const questionElement = quizForm.children[index];
                    if (!questionElement) return;

                    const answerLabels = questionElement.querySelectorAll('label');
                    const answersData = q.answers;
                    const correctAnswer = answersData.reduce((prev, current) => (current.points > prev.points) ? current : prev);

                    answerLabels.forEach((label, i) => {
                        const radio = label.querySelector('input');
                        const answerData = answersData[i];
                        radio.disabled = true;
                        label.classList.remove('cursor-pointer', 'hover:bg-gray-600', 'has-[:checked]:bg-indigo-600', 'has-[:checked]:ring-2', 'has-[:checked]:ring-indigo-400');
                        label.classList.add('cursor-default');
                        const isSelected = radio.checked;
                        const isCorrect = answerData.points === correctAnswer.points && correctAnswer.points > 0;

                        if (isSelected) {
                            if (isCorrect) {
                                // Réponse correcte sélectionnée : fond et cadre verts
                                label.classList.add('bg-green-600', 'text-white', 'ring-2', 'ring-green-400');
                            } else {
                                // Réponse incorrecte sélectionnée : cadre rouge
                                label.classList.add('ring-2', 'ring-red-500');
                            }
                        } else if (isCorrect) {
                            // La bonne réponse (non sélectionnée) : cadre vert pour la signaler
                            label.classList.add('ring-2', 'ring-green-500');
                        } else {
                            // Les autres mauvaises réponses : opacité réduite
                            label.classList.add('opacity-60');
                        }
                    });
                });

                // Scroll to top to see results
                window.scrollTo(0, 0);
            }

            // Function to restart the quiz
            function restartQuiz() {
                resultsContainer.classList.add('hidden');
                submitBtn.parentElement.classList.remove('hidden');
                loadQuiz();
                window.scrollTo(0, 0);
            }

            // Event Listeners
            submitBtn.addEventListener('click', showResults);
            restartBtn.addEventListener('click', restartQuiz);

            // --- Scroll to Top Button Logic ---
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    scrollToTopBtn.classList.remove('hidden');
                } else {
                    scrollToTopBtn.classList.add('hidden');
                }
            });
            scrollToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // Initial load of the quiz
            loadQuiz();
        });
    </script>
</body>
</html>
